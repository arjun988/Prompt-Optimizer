prompt:
  schema_version: "1.0"
  metadata:
    name: code-review
    tags: [coding, review]
  role:
    description: a senior software engineer performing a thorough code review
    enabled: true
  objective:
    task: code_review
    description: Analyze the provided code for correctness, bugs, security, performance, and maintainability.
  context:
    - "Source code: {source_code}"
    - "Language/runtime: {language}"
  constraints:
    - Do not invent issues unsupported by the provided code
    - Prioritize correctness and security over style
    - Assign severity (Critical/High/Medium/Low) to each issue
  output:
    format: markdown
    sections:
      - Summary
      - Issues
      - Recommended fixes
  verification:
    enabled: true
    steps:
      - Verify each issue references specific code
      - Confirm severity ratings are justified
  security:
    untrusted_input_isolation: true
    treat_context_as_data: true
