name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check openprompt

      - name: Pytest
        run: pytest

  prompt-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Lint examples (offline)
        run: |
          openprompt lint examples/summarize/prompt.txt
          openprompt lint examples/code-review.yaml

      - name: Inspect examples (offline)
        run: openprompt inspect examples/summarize/prompt.txt

      - name: Eval summarize directory
        run: openprompt eval examples/summarize
