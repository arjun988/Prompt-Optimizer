[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openprompt"
version = "0.3.0"
description = "Open-source prompt optimizer — analyze, optimize, evaluate, benchmark."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "OpenPrompt Contributors" }]
keywords = ["prompt", "llm", "optimization", "evaluation", "prompt-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
grok = ["openai>=1.0"]
gemini = ["google-genai>=1.0"]
semantic = ["sentence-transformers>=3.0"]
all-providers = ["openai>=1.0", "anthropic>=0.40", "google-genai>=1.0"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
media = ["pypdf>=4.0", "pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
    "mypy>=1.11",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.scripts]
openprompt = "openprompt.cli.main:app"

[project.entry-points."openprompt.operators"]
clarity = "openprompt.plugins.demo_operator:ClarityMutation"

[project.entry-points."openprompt.evaluators"]
contains = "openprompt.plugins.demo_evaluator:evaluate"

[project.entry-points."openprompt.strategies"]
passthrough_rewrite = "openprompt.plugins.demo_strategy:PassthroughRewriteStrategy"

[project.urls]
Homepage = "https://github.com/openprompt/openprompt"
Documentation = "https://github.com/openprompt/openprompt#readme"
Repository = "https://github.com/openprompt/openprompt"
Issues = "https://github.com/openprompt/openprompt/issues"

[tool.hatch.build.targets.wheel]
packages = ["openprompt"]

[tool.hatch.build.targets.wheel.force-include]
"openprompt/templates" = "openprompt/templates"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=openprompt --cov-report=term-missing --cov-fail-under=50"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
