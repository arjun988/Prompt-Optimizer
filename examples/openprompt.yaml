project: example-project

model:
  provider: mock
  name: mock-model

optimizer:
  strategy: reinforcement
  reinforcement_rounds: 2
  max_iterations: 5
  candidates_per_gen: 8
  eval_budget: 50

evaluation:
  metrics:
    - exact_match
    - contains
    - regex

objectives:
  quality_weight: 1.0
  token_weight: 0.3
  cost_weight: 0.2

privacy:
  telemetry: false
  storage: local
  db_path: .openprompt/runs.db

regression:
  min_score_delta: -0.05
  max_token_increase: 0.25
